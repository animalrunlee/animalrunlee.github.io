<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#F59E0B"/>
  <rect width="100" height="100" rx="22" fill="url(#g)" opacity="0.25"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <!-- Running animal silhouette -->
  <!-- Body -->
  <ellipse cx="44" cy="52" rx="18" ry="14" fill="#92400E"/>
  <!-- Head -->
  <circle cx="66" cy="42" r="10" fill="#92400E"/>
  <!-- Eye -->
  <circle cx="70" cy="40" r="2.5" fill="#FFFFFF"/>
  <circle cx="71" cy="39.5" r="1.2" fill="#1F2937"/>
  <!-- Ears -->
  <ellipse cx="62" cy="33" rx="3" ry="5" fill="#78350F" transform="rotate(-10 62 33)"/>
  <ellipse cx="70" cy="33" rx="3" ry="5" fill="#78350F" transform="rotate(10 70 33)"/>
  <!-- Front legs -->
  <rect x="56" y="60" width="5" height="16" rx="2.5" fill="#78350F" transform="rotate(15 58 68)"/>
  <rect x="48" y="60" width="5" height="16" rx="2.5" fill="#78350F" transform="rotate(-10 50 68)"/>
  <!-- Back legs -->
  <rect x="32" y="60" width="5" height="16" rx="2.5" fill="#78350F" transform="rotate(-15 34 68)"/>
  <rect x="24" y="60" width="5" height="16" rx="2.5" fill="#78350F" transform="rotate(10 26 68)"/>
  <!-- Tail -->
  <path d="M26 48 Q18 38 22 30" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkered flag -->
  <rect x="76" y="24" width="2" height="40" fill="#1F2937"/>
  <rect x="78" y="24" width="8" height="6" fill="#F59E0B"/>
  <rect x="82" y="30" width="8" height="6" fill="#FFFFFF"/>
  <rect x="78" y="36" width="8" height="6" fill="#F59E0B"/>
  <rect x="82" y="42" width="8" height="6" fill="#FFFFFF"/>
</svg>
