<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-raised:#F3F4F6;
  --border:#374151;
  --border-thin:#9CA3AF;
  --border-thick:#1F2937;
  --primary:#2563EB;
  --primary-hover:#1D4ED8;
  --primary-light:#DBEAFE;
  --primary-ring:rgba(37,99,235,0.35);
  --error:#DC2626;
  --error-bg:#FEE2E2;
  --success:#059669;
  --success-bg:#D1FAE5;
  --warning:#D97706;
  --warning-bg:#FEF3C7;
  --text:#1F2937;
  --text-secondary:#374151;
  --text-muted:#6B7280;
  --accent-animalrun:#EA580C;
  --accent-animalrun-bg:#FFEDD5;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-8:32px;
  --space-10:40px;
  --font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
  --text-xs:13px;
  --text-sm:15px;
  --text-base:18px;
  --text-lg:22px;
  --text-xl:26px;
  --text-2xl:30px;
  --text-3xl:38px;
  --weight-regular:400;
  --weight-medium:500;
  --weight-semibold:600;
  --weight-bold:700;
  --weight-extrabold:800;
  --line-height:1.6;
  --touch-min:56px;
  --btn-radius:12px;
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.10);
  --shadow-md:0 2px 8px rgba(0,0,0,0.12);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.14);
  --transition-fast:150ms ease;
  --transition-base:200ms ease;
}
html{
  touch-action:manipulation;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-text-size-adjust:100%;
}
body{
  font-family:var(--font-family);
  background:var(--bg);
  color:var(--text);
  height:100vh;height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-size:var(--text-base);
  line-height:var(--line-height);
  font-weight:var(--weight-regular);
}
#rotateWrapper{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}

/* ── Mobile 90 auto-rotation: portrait touch devices ── */
@media (orientation: portrait) and (hover: none){
  #rotateWrapper{
    position:fixed;
    top:50%;left:50%;
    width:100vh;height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
    overflow:hidden;
  }
}
@supports(padding:max(0px)){
  #rotateWrapper{
    padding-left:max(0px,env(safe-area-inset-top));
    padding-right:max(0px,env(safe-area-inset-bottom));
  }
}

/* ── Mobile: 레이스 화면이 화면을 꽉 채우도록 (터치 기기) ── */
@media (hover: none){
  .canvas-wrap{
    /* inset:0으로만 채움 — vw/vh는 뷰포트 기준이라 회전된 래퍼에서 강제로 포트레이트 크기가 되어
       캔버스가 잘려버림. fixed의 실제 containing block(회전된 rotateWrapper)을 정확히 채우도록 함 */
    position:fixed;inset:0;
    max-width:none;aspect-ratio:auto;
    border:none;border-radius:0;box-shadow:none;
  }
}

.container{
  width:100%;max-width:640px;margin:0 auto;padding:0 var(--space-3);
  display:flex;flex-direction:column;flex:1;min-height:0;
}
.screen{display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(var(--space-3),env(safe-area-inset-bottom))}
.screen.show{display:flex}
[hidden]{display:none !important}

/* ── Selection screen ── */
.sel-header{padding:var(--space-4) 0 var(--space-2);text-align:center;flex-shrink:0}
.sel-title{font-size:clamp(26px,6vw,40px);font-weight:var(--weight-extrabold);color:var(--text);line-height:1.2;letter-spacing:-0.5px}
.sel-title .accent{color:var(--accent-animalrun)}

.animal-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:var(--space-2);
  padding:var(--space-2) 0;
  flex-shrink:0;
}
.animal-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);
  padding:var(--space-2) var(--space-1);
  background:var(--surface);
  border:3px solid var(--border-thin);
  border-radius:var(--radius);
  min-height:96px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:all var(--transition-fast);
  font-family:var(--font-family);
}
.animal-card:active{transform:scale(0.96)}
.animal-card .card-canvas{width:72px;height:56px;display:block}
.animal-card .card-name{font-size:var(--text-sm);font-weight:var(--weight-bold);color:var(--text);line-height:1.2}
.animal-card.selected{
  border-color:var(--accent-animalrun);
  background:var(--accent-animalrun-bg);
  box-shadow:0 0 0 3px rgba(234,88,12,0.30);
}
.animal-card.selected .card-name{color:var(--accent-animalrun)}
.animal-card:focus-visible{outline:3px solid var(--accent-animalrun);outline-offset:2px}

.sel-actions{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-2) 0;flex-shrink:0}
.btn-start{
  width:100%;min-height:var(--touch-min);
  padding:var(--space-4) var(--space-5);
  border-radius:var(--btn-radius);border:3px solid var(--accent-animalrun);
  background:var(--accent-animalrun);color:#FFFFFF;
  font-size:var(--text-2xl);font-weight:var(--weight-extrabold);
  font-family:var(--font-family);cursor:pointer;
  box-shadow:var(--shadow-md);line-height:1.3;
  transition:all var(--transition-base);-webkit-tap-highlight-color:transparent;
}
.btn-start:active{background:#C2410C;transform:scale(0.98)}
.btn-start:disabled{background:var(--surface-raised);border-color:var(--border-thin);color:var(--text-muted);cursor:not-allowed;box-shadow:none}
.btn-start .btn-cnt{font-size:var(--text-lg);font-weight:var(--weight-bold);opacity:0.95}

.btn-portal{
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  width:100%;min-height:48px;padding:var(--space-3) var(--space-5);
  border-radius:var(--btn-radius);border:2.5px solid var(--border);
  background:var(--surface-raised);color:var(--text);font-size:var(--text-base);
  font-weight:var(--weight-bold);font-family:var(--font-family);cursor:pointer;
  transition:all var(--transition-base);line-height:1.2;-webkit-tap-highlight-color:transparent;
}
.btn-portal:active{background:var(--border-thin);transform:scale(0.98)}
.btn-portal-inline{
  width:auto;min-height:40px;padding:var(--space-1) var(--space-4);
  font-size:var(--text-sm);border-radius:999px;
}
.sel-title-row{display:flex;align-items:center;justify-content:center;width:100%;position:relative;min-height:44px}
.sel-title-row .btn-portal-inline{position:absolute;right:0;top:50%;transform:translateY(-50%)}

/* ── Race screen ── */
.screen-race{overflow:hidden;padding-bottom:0;touch-action:none;position:relative;align-items:center;justify-content:center}
.canvas-wrap{
  position:relative;width:100%;max-width:calc(100vw*16/9);
  aspect-ratio:16/9;flex:none;
  border:3px solid var(--border-thick);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.canvas-wrap canvas{display:block;width:100%;height:100%}
.countdown-overlay{
  position:absolute;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.18);
  pointer-events:none;
}
.countdown-num{
  font-size:clamp(72px,24vw,150px);
  font-weight:var(--weight-extrabold);
  color:var(--accent-animalrun);
  text-shadow:0 4px 20px rgba(0,0,0,0.25);
  animation:cdPop 700ms ease forwards;
  line-height:1;
}
@keyframes cdPop{
  0%{transform:scale(0.4);opacity:0}
  30%{transform:scale(1.15);opacity:1}
  70%{transform:scale(1);opacity:1}
  100%{transform:scale(1.1);opacity:0}
}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.70);display:none;
  justify-content:center;z-index:100;padding:var(--space-5);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.modal-overlay.show{display:flex}
#modalResult{justify-content:center;align-items:center;padding:var(--space-3);background:rgba(15,23,42,0.22);pointer-events:none}
#modalResult .modal{max-width:290px;margin:0;padding:var(--space-4);pointer-events:auto}
#modalResult h2{font-size:clamp(16px,4.5vw,22px);margin-bottom:var(--space-2)}
#modalResult .winner-banner{font-size:clamp(14px,4vw,18px);padding:var(--space-1) var(--space-2);margin-bottom:var(--space-2)}
#modalResult .modal-actions{margin-top:var(--space-2)}
.modal{
  position:relative;background:var(--surface);border-radius:var(--radius-lg);
  padding:var(--space-6) var(--space-5);width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,0.50);text-align:center;
  animation:modalIn 250ms ease;border:3px solid var(--border);margin:auto;
}
@keyframes modalIn{from{opacity:0;transform:scale(0.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h2{font-size:clamp(20px,6vw,30px);font-weight:var(--weight-extrabold);margin-bottom:var(--space-2);color:var(--text);line-height:1.3}
.winner-banner{
  font-size:clamp(18px,5vw,24px);font-weight:var(--weight-extrabold);
  color:var(--accent-animalrun);margin-bottom:var(--space-3);
  background:var(--accent-animalrun-bg);border:2px solid var(--accent-animalrun);
  border-radius:var(--radius);padding:var(--space-2) var(--space-3);
}
.modal-actions{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)}
.btn{
  width:100%;min-height:var(--touch-min);padding:var(--space-4) var(--space-5);border-radius:var(--btn-radius);
  font-size:var(--text-lg);font-weight:var(--weight-bold);
  font-family:var(--font-family);cursor:pointer;transition:all var(--transition-base);
  line-height:1.3;-webkit-tap-highlight-color:transparent;
}
.btn-primary{background:var(--accent-animalrun);color:#FFFFFF;border:3px solid var(--accent-animalrun)}
.btn-primary:active{background:#C2410C;transform:scale(0.97)}
.btn-secondary{background:var(--surface);color:var(--text);border:2.5px solid var(--border)}
.btn-secondary:active{background:var(--surface-raised);transform:scale(0.97)}

button:focus-visible{outline:3px solid var(--accent-animalrun);outline-offset:2px}
::-webkit-scrollbar{display:none}
</style>
</head>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════ */
var PORTAL_URL = 'https://appa-games.github.io/';
var COUNTDOWN_MS = 700;
var LEG_SWAP_MS = 90;
var MAX_RACE_MS = 22000;

var ANIMALS = [
  { id:'yoshi',   name:'요시',   color:'#22C55E', paint:null },
  { id:'sheep',   name:'양',     color:'#F5F5F5', paint:null },
  { id:'donkey',  name:'당나귀', color:'#A8A29E', paint:null },
  { id:'turtle',  name:'거북이', color:'#65A30D', paint:null },
  { id:'penguin', name:'펭귄',   color:'#1F2937', paint:null },
  { id:'tiger',   name:'호랑이', color:'#EA580C', paint:null },
  { id:'wolf',    name:'늑대',   color:'#6B7280', paint:null },
  { id:'bear',    name:'곰',     color:'#92400E', paint:null },
  { id:'lion',    name:'사자',   color:'#EAB308', paint:null },
  { id:'gorilla', name:'고릴라', color:'#374151', paint:null }
];

var SPRITE_FILES = { yoshi:'sprites/dinosaur.png', sheep:'sprites/sheep.png', donkey:'sprites/donkey.png', turtle:'sprites/turtle.png', penguin:'sprites/penguin.png', tiger:'sprites/tiger.png', wolf:'sprites/wolf.png', bear:'sprites/bear.png', lion:'sprites/lion.png', gorilla:'sprites/gorilla.png' };
var SPRITE_FLIP = {};

function spriteBox(img) {
  var c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  var cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  var d = cx.getImageData(0, 0, img.width, img.height).data;
  var minX = img.width, minY = img.height, maxX = 0, maxY = 0;
  for (var i = 0; i < d.length; i += 4) {
    if (d[i + 3] > 40) {
      var px = (i / 4) % img.width;
      var py = (i / 4) / img.width | 0;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }
  }
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function makeImagePaint(box, img) {
  var nh = 44;
  if (box.w > box.h * 1.4) nh = Math.min(nh, 52 * box.h / box.w);
  var nw = box.w * nh / box.h;
  if (nw > 52) { nw = 52; nh = box.h * 52 / box.w; }
  var flip = SPRITE_FLIP[box.id] || false;
  var p = function(ctx2, legFrame) {
    if (flip) {
      ctx2.save();
      ctx2.translate(nw / 2, 17 - nh);
      ctx2.scale(-1, 1);
      ctx2.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, nw, nh);
      ctx2.restore();
    } else {
      ctx2.drawImage(img, box.x, box.y, box.w, box.h, -nw / 2, 17 - nh, nw, nh);
    }
  };
  p.isImage = true;
  p.nw = nw;
  p.nh = nh;
  return p;
}

var spritesReady = false;
function loadSprites(cb) {
  var total = 0;
  var done = 0;
  var k;
  for (k in SPRITE_FILES) total++;
  for (k in SPRITE_FILES) {
    (function(key, src) {
      var img = new Image();
      img.onload = function() {
        var box = spriteBox(img);
        box.id = key;
        var paint = makeImagePaint(box, img);
        for (var a = 0; a < ANIMALS.length; a++) {
          if (ANIMALS[a].id === key) ANIMALS[a].paint = paint;
        }
        done++;
        if (done >= total) { spritesReady = true; if (cb) cb(); }
      };
      img.onerror = function() { done++; if (done >= total) { spritesReady = true; if (cb) cb(); } };
      img.src = src;
    })(k, SPRITE_FILES[k]);
  }
}

/* ═══════════════════════════════════════
   DOM REFERENCES
   ═══════════════════════════════════════ */
var screenSelect = document.getElementById('screenSelect');
var screenRace = document.getElementById('screenRace');
var animalGrid = document.getElementById('animalGrid');
var btnStart = document.getElementById('btnStart');
var canvasWrap = document.getElementById('canvasWrap');
var gameCanvas = document.getElementById('raceCanvas');
var ctx = gameCanvas.getContext('2d');
var countdownOverlay = document.getElementById('countdownOverlay');
var countdownNum = document.getElementById('countdownNum');
var modalResult = document.getElementById('modalResult');
var winnerBanner = document.getElementById('winnerBanner');
var btnRetry = document.getElementById('btnRetry');
var btnNewSel = document.getElementById('btnNewSel');

/* ═══════════════════════════════════════
   CANVAS DRAW HELPERS
   ═══════════════════════════════════════ */
function rr(ctx2, x, y, w, h, r) {

function drawSprite(canvas2, animal, legFrame) {
  var ctx2 = canvas2.getContext('2d');
  var w = canvas2.width;
  var h = canvas2.height;
  ctx2.clearRect(0, 0, w, h);
  var s;
  if (animal.paint && animal.paint.isImage) {
    s = Math.min(w / animal.paint.nw, h / animal.paint.nh) * 0.94;
  } else {
    s = Math.min(w, h) / 52;
  }
  ctx2.save();
  ctx2.translate(w / 2, h - 1 - 17 * s);
  ctx2.scale(s, s);
  if (!animal.paint.isImage) {
    groundShadow(ctx2);
    animal.paint(ctx2, legFrame);
    bodyShade(ctx2);
  } else {
    animal.paint(ctx2, legFrame);
  }
  ctx2.restore();
}

var selected = {};
var miniCanvases = [];

function buildSelection() {
  animalGrid.innerHTML = '';
  miniCanvases = [];
  for (var i = 0; i < ANIMALS.length; i++) {
    (function(idx) {
      var a = ANIMALS[idx];
      var card = document.createElement('div');
      card.className = 'animal-card';
      card.setAttribute('data-id', a.id);
      card.tabIndex = 0;
      var cv = document.createElement('canvas');
      cv.className = 'card-canvas';
      cv.width = 72;
      cv.height = 56;
      card.appendChild(cv);
      card.addEventListener('click', function() {
        toggleSelect(a.id);
      });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleSelect(a.id);
        }
      });
      animalGrid.appendChild(card);
      drawSprite(cv, a, 0);
      miniCanvases.push({ cv: cv, animal: a });
    })(i);
  }
  selected = {};
  updateStartButton();
}

function toggleSelect(id) {
  if (selected[id]) {
    delete selected[id];
  } else {
    selected[id] = true;
  }
  var cards = animalGrid.querySelectorAll('.animal-card');
  for (var i = 0; i < cards.length; i++) {
    var cid = cards[i].getAttribute('data-id');
    if (selected[cid]) {
      cards[i].classList.add('selected');
    } else {
      cards[i].classList.remove('selected');
    }
  }
  updateStartButton();
}

function updateStartButton() {
  var n = Object.keys(selected).length;
  var cntEl = btnStart.querySelector('.btn-cnt');
  if (n === 0) {
    cntEl.textContent = '경주 시작!';
    btnStart.disabled = true;
  } else if (n === 1) {
    cntEl.textContent = '1마리 더 고르세요';
    btnStart.disabled = true;
  } else {
    cntEl.textContent = '경주 시작! (' + n + '마리)';
    btnStart.disabled = false;
  }
}

function startMiniAnimation() {

    miniLegFrame = (miniLegFrame + 1) % 4;

      drawSprite(miniCanvases[i].cv, miniCanvases[i].animal, miniLegFrame);

/* 경주 중 랜덤 가속/감속 페이즈 — 느려졌다 빨라졌다 반복 */
var camX = 0;              // 레이스 카메라 기준점 (팩 중앙 추적)
var camZ = 1;              // 레이스 카메라 줌 (전 동물 뷰에 맞춤)
var maxSpreadSeen = 0;     // 지금까지 본 팩 최대 퍼짐 — 결승 직전 줌인(확대) 방지용
var TRACK_MULT = 6;        // 트랙 길이 = 화면 폭의 6배
var DIST_MARK = 128;       // 배경 거리 마커 간격

var THEMES = [
  { scene:'beach',  bg:['#7EC8E3','#A8DCE7','#FEF3C7'], lane:['rgba(255,249,224,0.92)','rgba(253,230,138,0.92)'], border:'#D97706', marker:'rgba(180,83,9,0.10)', ground:'#FCD34D', ground2:'#F59E0B' },

  { scene:'snow',   bg:['#A8C4DE','#D7E3F0','#F8FAFC'], lane:['rgba(224,242,254,0.92)','rgba(191,219,254,0.92)'], border:'#0284C7', marker:'rgba(2,132,199,0.10)', ground:'#E2E8F0', ground2:'#CBD5E1' },
  { scene:'sunset', bg:['#FDBA74','#FB7185','#7E22CE'], lane:['rgba(255,247,205,0.92)','rgba(254,243,199,0.92)'], border:'#B45309', marker:'rgba(180,83,9,0.10)', ground:'#581C87', ground2:'#3B0764' },
  { scene:'night',  bg:['#0F172A','#1E293B','#334155'], lane:['rgba(51,65,85,0.92)','rgba(71,85,105,0.92)'], border:'#94A3B8', marker:'rgba(148,163,184,0.12)', ground:'#020617', ground2:'#0F172A' },
  { scene:'forest', bg:['#86EFAC','#4ADE80','#166534'], lane:['rgba(240,253,244,0.92)','rgba(220,252,231,0.92)'], border:'#15803D', marker:'rgba(21,128,61,0.10)', ground:'#14532D', ground2:'#166534' }
];
var raceTheme = null;

var SPEED_PHASES = [0.55, 0.8, 1.0, 1.2, 1.45];

function startRace(ids) {
  lastRaceRacers = ids.slice();
  racers = [];
  for (var i = 0; i < ids.length; i++) {
    var a = getAnimal(ids[i]);
    if (!a) continue;
    racers.push({
      animal: a,
      ability: 0.92 + Math.random() * 0.16,
      phaseMult: 1,
      phaseLeft: 0,
      progress: 0,
      finished: false,
      finishRank: 0,
      finishTime: 0
    });
  }
  var targetMs = 15000 + Math.random() * 5000;
  baseSpeed = 100 / (targetMs / 16.67);
  finishOrder = 0;
  legFrame = 0;
  lastLegSwap = 0;
  showScreen(screenRace);
  resizeCanvas();
  modalResult.classList.remove('show');
  // 카운트다운 중에도 출발선에서 대기하는 동물들이 보이도록 카메라/테마를 먼저 고정하고 렌더 시작
  raceState = 'countdown';
  maxSpreadSeen = 0;
  raceTheme = THEMES[Math.floor(Math.random() * THEMES.length)];
  camZ = 1;
  var W0 = canvasWrap.clientWidth;
  var trackLen0 = Math.max(W0 * TRACK_MULT, 900);
  var packCenter0 = 60;
  camX = Math.max(W0 / 2 - 70, Math.min(trackLen0 - W0 / 2 + 70, packCenter0));
  rafId = requestAnimationFrame(raceLoop);
  runCountdown();
}

function runCountdown() {
  var steps = ['3', '2', '1', '🏁 GO!'];
  var delay = 0;
  for (var i = 0; i < steps.length; i++) {
    (function(stepText, d) {
      setTimeout(function() {
        countdownNum.textContent = stepText;
        countdownOverlay.hidden = false;
        countdownNum.style.animation = 'none';
        countdownNum.offsetHeight;
        countdownNum.style.animation = '';
      }, d);
    })(steps[i], delay);
    delay += COUNTDOWN_MS;
  }
  setTimeout(function() {
    countdownOverlay.hidden = true;
    beginRunning();
  }, delay);
}

function beginRunning() {
  raceState = 'running';
  raceT0 = performance.now();
  lastLegSwap = raceT0;
  resizeCanvas();
}

function raceLoop(ts) {
  if (raceState === 'countdown') {
    renderRace();
    rafId = requestAnimationFrame(raceLoop);
    return;
  }
  if (raceState !== 'running') return;
  var dt = ts - lastLegSwap;
  if (dt >= LEG_SWAP_MS) {
    legFrame = (legFrame + 1) % 4;
    lastLegSwap = ts;
  }
  raceElapsed = ts - raceT0;
  updateRacers(ts);
  renderRace();
  if (raceState === 'running') {
    rafId = requestAnimationFrame(raceLoop);
  }
}

function updateRacers(ts) {
  var active = 0;
  for (var i = 0; i < racers.length; i++) {
    if (!racers[i].finished) active++;
  }
  if (active > 0) {
    var maxP = -1;
    var minP = 101;
    for (var j = 0; j < racers.length; j++) {
      var r = racers[j];
      if (r.finished) continue;
      if (r.progress > maxP) maxP = r.progress;
      if (r.progress < minP) minP = r.progress;
    }
    for (var k = 0; k < racers.length; k++) {
      var rc = racers[k];
      if (rc.finished) continue;
      if (rc.phaseLeft <= 0) {
        rc.phaseMult = SPEED_PHASES[Math.floor(Math.random() * SPEED_PHASES.length)];
        rc.phaseLeft = 30 + Math.floor(Math.random() * 61);
      }
      rc.phaseLeft--;
      var speed = baseSpeed * rc.ability * rc.phaseMult * (0.92 + Math.random() * 0.16);
      if (rc.progress === maxP && maxP > 5) speed *= 0.88;
      if (rc.progress === minP && racers.length > 2) speed *= 1.12;
      rc.progress += speed;
      if (rc.progress >= 100) {
        rc.progress = 100;
        rc.finished = true;
        finishOrder++;
        rc.finishRank = finishOrder;
        rc.finishTime = raceElapsed;
      }
    }
  }
  var anyActive = false;
  for (var m = 0; m < racers.length; m++) {
    if (!racers[m].finished) { anyActive = true; break; }
  }
  var timedOut = raceElapsed > MAX_RACE_MS;
  if (timedOut && anyActive) {
    for (var n = 0; n < racers.length; n++) {
      if (!racers[n].finished) {
        racers[n].finished = true;
        finishOrder++;
        racers[n].finishRank = finishOrder;
        racers[n].finishTime = raceElapsed;
      }
    }
    anyActive = false;
  }
  if (!anyActive) {
    raceState = 'done';
    setTimeout(showResult, 700);
  }
}

/* ═══════════════════════════════════════
   RACE CANVAS RENDERING
   ═══════════════════════════════════════ */
function resizeCanvas() {
  var wrapW = canvasWrap.clientWidth;
  var wrapH = canvasWrap.clientHeight;
  var dpr = window.devicePixelRatio || 1;
  gameCanvas.width = Math.max(1, Math.round(wrapW * dpr));
  gameCanvas.height = Math.max(1, Math.round(wrapH * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawScene(t, vx, worldW, worldH, skyH) {
  if (!t) return;
  var gy = worldH - worldH * 0.10;
  var grd = ctx.createLinearGradient(0, 0, 0, worldH);
  for (var gi = 0; gi < t.bg.length; gi++) {
    grd.addColorStop(gi / (t.bg.length - 1 || 1), t.bg[gi]);
  }
  ctx.fillStyle = grd;
  ctx.fillRect(vx, 0, worldW, worldH);
  var i, sx, sy, cw, cy, cx;
  if (t.scene === 'night') {
    ctx.fillStyle = '#FFFFFF';
    for (i = 0; i < 30; i++) {
      sx = vx + ((i * 97 + 13) % 100) / 100 * worldW;
      sy = ((i * 31 + 7) % 100) / 100 * skyH;
      ctx.globalAlpha = 0.25 + ((i * 11) % 6) / 10;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#FDE68A';
    ctx.beginPath();
    ctx.arc(vx + worldW * 0.82, skyH * 0.38, worldH * 0.045, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0F172A';
    ctx.beginPath();
    ctx.arc(vx + worldW * 0.80, skyH * 0.35, worldH * 0.04, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0B1220';
    for (i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(vx + worldW * (0.15 + i * 0.34), skyH, worldH * 0.20, Math.PI, 0);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = t.scene === 'sunset' ? '#FF6B35' : '#FDE047';
    ctx.beginPath();
    ctx.arc(vx + worldW * (t.scene === 'sunset' ? 0.50 : 0.82), skyH * (t.scene === 'sunset' ? 0.60 : 0.38), worldH * (t.scene === 'sunset' ? 0.075 : 0.045), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = t.scene === 'sunset' ? 'rgba(88,28,135,0.55)' : 'rgba(255,255,255,0.85)';
    for (i = 0; i < 3; i++) {
      cx = vx + ((i * 137 + 29) % 100) / 100 * worldW;
      cy = skyH * (0.18 + ((i * 53) % 30) / 100);
      cw = worldH * 0.042;
      ctx.beginPath();
      ctx.arc(cx, cy, cw, 0, Math.PI * 2);
      ctx.arc(cx + cw * 1.2, cy - cw * 0.35, cw * 0.8, 0, Math.PI * 2);
      ctx.arc(cx + cw * 2.1, cy, cw * 0.85, 0, Math.PI * 2);
      ctx.fill();
    }
    if (t.scene === 'field') {
      ctx.fillStyle = '#4ADE80';
      for (i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(vx + worldW * (0.18 + i * 0.32), skyH, worldH * 0.18, Math.PI, 0);
        ctx.fill();
      }
      ctx.fillStyle = '#F43F5E';
      for (i = 0; i < 10; i++) {
        ctx.fillRect(vx + ((i * 61 + 3) % 100) / 100 * worldW, skyH + ((i * 29 + 11) % 50) / 100 * worldH * 0.02, 3, 3);
      }
    } else if (t.scene === 'forest') {
      ctx.fillStyle = '#14532D';
      for (i = 0; i < 6; i++) {
        var tx = vx + worldW * (0.04 + i * 0.18);
        var th = worldH * 0.10;
        ctx.beginPath();
        ctx.moveTo(tx, skyH);
        ctx.lineTo(tx - th * 0.35, skyH);
        ctx.lineTo(tx, skyH - th);
        ctx.lineTo(tx + th * 0.35, skyH);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#166534';
      for (i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(vx + worldW * (0.08 + i * 0.28), skyH, worldH * 0.05, Math.PI, 0);
        ctx.fill();
      }
    } else if (t.scene === 'beach') {
      ctx.fillStyle = '#38BDF8';
      ctx.fillRect(vx, skyH - worldH * 0.05, worldW, worldH * 0.06);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (i = 0; i < 9; i++) {
        ctx.beginPath();
        ctx.arc(vx + worldW * (0.03 + i * 0.11), skyH - worldH * 0.035, worldH * 0.012, 0, Math.PI);
        ctx.fill();
      }
    } else if (t.scene === 'snow') {
      ctx.fillStyle = '#F8FAFC';
      for (i = 0; i < 4; i++) {
        var px2 = vx + worldW * (0.1 + i * 0.27);
        var bw2 = worldH * 0.20;
        var ph2 = worldH * (0.15 + (i % 2) * 0.05);
        ctx.beginPath();
        ctx.moveTo(px2 - bw2, skyH);
        ctx.lineTo(px2, skyH - ph2);
        ctx.lineTo(px2 + bw2, skyH);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (i = 0; i < 26; i++) {
        ctx.fillRect(vx + ((i * 47 + 11) % 100) / 100 * worldW, ((i * 23 + 5) % 100) / 100 * skyH, 2, 2);
      }
    } else if (t.scene === 'sunset') {
      ctx.fillStyle = '#581C87';
      for (i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(vx + worldW * (0.12 + i * 0.36), skyH, worldH * 0.22, Math.PI, 0);
        ctx.fill();
      }
    }
  }
  ctx.fillStyle = t.ground;
  ctx.fillRect(vx, gy, worldW, worldH - gy);
  ctx.fillStyle = t.ground2;
  ctx.fillRect(vx, gy, worldW, (worldH - gy) * 0.18);
}

function renderRace() {
  var W = canvasWrap.clientWidth;
  var H = canvasWrap.clientHeight;
  ctx.clearRect(0, 0, W, H);
  var n = racers.length;

  // 롱 트랙 — 결승선(체커 존)은 트랙 맨 끝에만 존재
  var trackLen = Math.max(W * TRACK_MULT, 900);
  var finishZoneW = 50;
  var padL = 60;
  var trackL = padL;
  var finishX = trackLen - finishZoneW;
  var trackW = finishX - trackL;

  // 동물 위치(월드 좌표)
  var xs = [];
  for (var ix = 0; ix < n; ix++) {
    xs.push(trackL + (racers[ix].progress / 100) * trackW);
  }
  var pMin = xs[0], pMax = xs[0];
  for (var ix2 = 1; ix2 < n; ix2++) {
    if (xs[ix2] < pMin) pMin = xs[ix2];
    if (xs[ix2] > pMax) pMax = xs[ix2];
  }

  // 카메라 기준점 = 팩의 중앙 — 모든 동물이 뷰 안에 들어오도록 줌 조절
  // 양끝에 패딩(70px)을 둬서 동물이 뷰 가장자리에서 잘리지 않게 함
  // maxSpreadSeen을 기억해두면 팩이 모이는 결승 직전에 줌인(확대)되는 느낌이 없음
  var spread = pMax - pMin;
  if (spread > maxSpreadSeen) maxSpreadSeen = spread;
  var targetZoom = Math.max(0.4, Math.min(1, (W - 140) / Math.max(spread, W * 0.5, maxSpreadSeen)));
  camZ += (targetZoom - camZ) * 0.12;
  if (Math.abs(targetZoom - camZ) < 0.005) camZ = targetZoom;
  var worldW = W / camZ;
  var worldH = H / camZ;
  var skyH = worldH * 0.15;
  var groundH = worldH * 0.10;
  var laneH = (worldH - skyH - groundH) / n;
  var packCenter = (pMin + pMax) / 2;
  var camTarget = Math.max(worldW / 2 - 70, Math.min(trackLen - worldW / 2 + 70, packCenter));
  camX += (camTarget - camX) * 0.12;
  if (Math.abs(camTarget - camX) < 1) camX = camTarget;

  ctx.save();
  ctx.scale(camZ, camZ);
  ctx.translate(W / (2 * camZ) - camX, 0);

  // 배경 테마 — 랜덤 환경 씬 (하늘/해/달/구름/산/바다/지면)
  drawScene(raceTheme, camX - worldW / 2, worldW, worldH, skyH);

  // 레인 배경 — 트랙 전체를 하나의 부드러운 톤으로 (레인 구분선 없음)
  ctx.fillStyle = raceTheme ? raceTheme.lane[0] : '#FEF3C7';
  ctx.fillRect(0, skyH, trackLen, n * laneH);

  // 배경 거리 마커 — 흐릿하게 잔상 느낌만
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = raceTheme ? raceTheme.marker : 'rgba(180,83,9,0.16)';
  for (var m = DIST_MARK; m < finishX; m += DIST_MARK) {
    ctx.fillRect(m, 0, 1, worldH);
  }
  ctx.restore();

  // 출발선
  ctx.strokeStyle = '#1F2937';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(trackL, 0);
  ctx.lineTo(trackL, worldH);
  ctx.stroke();

  // 결승선 (체커 존) — 트랙 맨 끝
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(finishX, 0, finishZoneW, worldH);
  var checkerSize = finishZoneW / 2;
  ctx.fillStyle = '#111827';
  for (var r = 0; r < (worldH + checkerSize - 1) / checkerSize; r++) {
    for (var c = 0; c < 2; c++) {
      if ((r + c) % 2 === 0) {
        ctx.fillRect(finishX + c * checkerSize, r * checkerSize, checkerSize, checkerSize);
      }
    }
  }
  ctx.strokeStyle = '#1F2937';
  ctx.lineWidth = 2;
  ctx.strokeRect(finishX, 0, finishZoneW, worldH);

  // 동물 — 발(17)이 레인 바닥(레일)에 정확히 닿도록 배치, 완주자는 결승선에서 정지
  for (var i2 = 0; i2 < n; i2++) {
    var rc = racers[i2];
    var laneBottom = skyH + (i2 + 1) * laneH;
    var sx = trackL + (rc.progress / 100) * trackW;
    var s = Math.max(0.7, Math.min(2.0, laneH / 52));
    var lf = rc.progress >= 100 ? 0 : legFrame;
    var bob = lf === 1 ? -1.2 : (lf === 3 ? 1.1 : 0);
    ctx.save();
    ctx.translate(sx, laneBottom - 17 * s + bob * s);
    ctx.scale(s, s);
    groundShadow(ctx);
    rc.animal.paint(ctx, lf);
    if (!rc.animal.paint.isImage) bodyShade(ctx);
    ctx.restore();
  }

  // 도착 순위 배지 — 결승선에 도착한 동물 위에 실시간 표시
  for (var ir = 0; ir < n; ir++) {
    var rc3 = racers[ir];
    if (rc3.finishRank <= 0) continue;
    var lb3 = skyH + (ir + 1) * laneH;
    var s3 = Math.max(0.7, Math.min(2.0, laneH / 52));
    var bx3 = trackL + (rc3.progress / 100) * trackW;
    var r3 = Math.max(10, laneH * 0.3);
    var by3 = lb3 - 17 * s3 - r3 - 4;
    if (rc3.finishRank === 1) ctx.fillStyle = '#FBBF24';
    else if (rc3.finishRank === 2) ctx.fillStyle = '#D1D5DB';
    else if (rc3.finishRank === 3) ctx.fillStyle = '#D97706';
    else ctx.fillStyle = '#9CA3AF';
    ctx.beginPath();
    ctx.arc(bx3, by3, r3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = rc3.finishRank === 2 ? '#334155' : '#FFFFFF';
    ctx.font = 'bold ' + Math.max(9, r3 * 0.95) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rc3.finishRank + '위', bx3, by3);
  }

  ctx.restore();
}

/* ═══════════════════════════════════════
   RESULTS
   ═══════════════════════════════════════ */
function showResult() {
  var winner = null;
  for (var i = 0; i < racers.length; i++) {
    if (racers[i].finishRank === 1) winner = racers[i];
  }
  if (winner) {
    winnerBanner.textContent = '🎉 ' + winner.animal.name + ' 우승!';
  } else {
    winnerBanner.textContent = '🎉 경주 완료!';
  }
  modalResult.classList.add('show');
}

/* ═══════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════ */
function getAnimal(id) {
  for (var i = 0; i < ANIMALS.length; i++) {
    if (ANIMALS[i].id === id) return ANIMALS[i];
  }
  return null;
}
function showScreen(el) {
  screenSelect.classList.remove('show');
  screenRace.classList.remove('show');
  el.classList.add('show');
}

/* ═══════════════════════════════════════
   BIND EVENTS
   ═══════════════════════════════════════ */
btnStart.addEventListener('click', function() {
  var ids = [];
  for (var id in selected) {
    if (selected[id]) ids.push(id);
  }
  if (ids.length >= 2) {
    stopMiniAnimation();
    startRace(ids);
  }
});

btnRetry.addEventListener('click', function() {
  modalResult.classList.remove('show');
  startRace(lastRaceRacers);
});

btnNewSel.addEventListener('click', function() {
  modalResult.classList.remove('show');
  showScreen(screenSelect);
  startMiniAnimation();
});

var portalBtns = document.querySelectorAll('.btn-portal');
for (var bi = 0; bi < portalBtns.length; bi++) {
  portalBtns[bi].addEventListener('click', function() {
    window.location.href = PORTAL_URL;
  });
}

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden' && raceState === 'running') {
    raceState = 'paused';
  } else if (document.visibilityState === 'visible' && raceState === 'paused') {
    raceState = 'running';
    raceT0 = performance.now() - raceElapsed;
    lastLegSwap = performance.now();
    rafId = requestAnimationFrame(raceLoop);
  }
});

window.addEventListener('resize', function() {
  if (raceState === 'running' || raceState === 'done') {
    resizeCanvas();
  }
});

function stopMiniAnimation() {
  if (miniTimer) {
    clearInterval(miniTimer);
    miniTimer = null;
  }
}

/* ═══════════════════════════════════════
   LAUNCH
   ═══════════════════════════════════════ */
function init() {
  buildSelection();
  startMiniAnimation();
  showScreen(screenSelect);
  resizeCanvas();
  renderIdle();
  loadSprites(function() {
    buildSelection();
  });
}

function renderIdle() {
  var W = canvasWrap.clientWidth;
  var H = canvasWrap.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#FEF3C7';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#B45309';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('동물을 골라주세요!', W / 2, H / 2);
}

init();
})();
</script>
</body>
</html>
